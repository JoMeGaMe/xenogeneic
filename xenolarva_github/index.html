<!-- 資安（v0.40.40）：內容安全政策。GitHub Pages 不能設 HTTP 標頭，所以用 meta。
     只准載入自己網站的程式、樣式、圖片、字體；不准外部連線、外掛、表單送出、改 base。
     style 允許 inline（程式裡有很多 style="…" 屬性）；圖片允許 data:／blob:（小圖內嵌、canvas）。
     單一 HTML（tools/build_single_file.py）全部是內嵌程式，打包時會換成允許 inline script 的版本。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<script src="js/err.js?v=205"></script>

</head>
<body>
<!-- 開頭的讀取畫面（v0.40.69）：data-n＝後面 <script> 的數量（build_single_file.py 自動更新） -->

<div id="achBanner" role="status" aria-live="polite"></div>
<main><div class="game"><div class="left">
<header><span><span id="ver" class="ver"></span><button id="bWatch" class="mbtn wbtn" hidden>觀察水缸</button><span id="day">第 1 日 / 7</span><span class="pips" id="pips" title="今日剩餘行動次數"></span></span><span id="cname"></span><span class="hr"><span id="pname"></span><button id="bSet" class="mbtn" hidden>設定</button><button id="bMenu" class="mbtn" hidden>說明／圖鑑</button><button id="bHam" class="mbtn ham" aria-label="選單" aria-expanded="false" aria-controls="hamMenu">☰</button></span><div id="hamMenu" hidden></div></header>
<div id="pvbar" hidden><button id="pvSel"></button><button id="pvTrans" class="tog" aria-pressed="false">翻譯：關</button><button id="pvPlay" data-t="ui.pvPlay">玩耍</button><button id="pvExit" data-t="ui.pvExit">離開</button></div>
<div class="tankwrap"><canvas id="tank" width="500" height="500" aria-label="水缸與異種幼體"></canvas><div id="toast" role="status" aria-live="polite"></div><div id="wq" hidden></div></div>
<div class="logwrap"><div id="log" role="log" aria-live="polite"></div></div>
</div>
<div id="acts">
<div id="notes"></div>
<button id="bGrete" class="tog" hidden></button>
<button id="bTrans" class="tog" hidden></button>
<div id="abtns">
<button id="bWater" class="abtn"><i class="ico" data-i="water"></i><span data-t="ui.water">換水</span><small data-t="ui.free">不耗行動</small></button>
<button id="bFeed" class="abtn"><i class="ico" data-i="feed"></i><span data-t="ui.feed">餵食</span><small data-t="ui.free">不耗行動</small></button>
<button id="bPlay" class="abtn"><i class="ico" data-i="play"></i><span data-t="ui.play">玩耍</span><small data-t="ui.cost">耗 1 行動</small><span class="ochip" id="bPlayMode" role="button" tabindex="0"></span></button>
<button id="bChat" class="abtn"><i class="ico" data-i="chat"></i><span data-t="ui.chat">聊天</span><small data-t="ui.cost">耗 1 行動</small></button>
<button id="bOut" class="abtn"><i class="ico" data-i="out"></i><span data-t="ui.out">出門</span><small data-t="ui.cost">耗 1 行動</small><span class="ochip" id="bOutMode" role="button" tabindex="0"></span></button>
<button id="bBag" class="abtn"><i class="ico" data-i="bag"></i><span data-t="ui.bag">物品</span><small data-t="ui.bagSub">查看庫存</small></button>
</div>
<button id="end" data-t="ui.end">結束今日</button>
<button id="bAccept" data-t="idle.accept">接取新委託</button>
<button id="bStory" data-t="story.idleBtn" hidden>主線：緊急委託</button>
<button id="bDev" hidden>開發者模式</button>
</div>
</div>
</main>
<div id="devp" hidden></div>
<div class="ov" id="ovStart"><div class="box intro">
<h2 data-t="ui.title">異種幼體養成模擬器</h2>
<div id="introStory" class="pp"></div>
<label for="pn" data-t="ui.sign">簽名</label>
<input type="text" id="pn" maxlength="8" placeholder="玩家">
<p class="dim" style="margin:10px 0 0" data-t="ui.ink">筆跡顏色</p>
<div id="introCol"></div>
<button id="go" class="main" data-t="ui.go">開始工作</button>
</div></div>
<div id="ovStory" role="dialog" aria-label="主線"></div>
<div class="ov" id="ovPick"><div class="box"><button id="pc" class="xbtn" aria-label="關閉">✕</button><h2 id="pt"></h2><div id="pScene" class="scene" hidden><img class="sbg" alt=""><img class="sitem" alt=""><img class="schr" alt=""><span class="sname"></span></div><p id="pp" class="pp"></p><p id="pNote" class="pnote" hidden></p><figure id="pFig" class="pfig" hidden><img id="pAv" class="pav" alt=""><div id="pTag" class="pname" hidden></div></figure><div id="po"></div></div></div>
<div class="ov" id="ovWatch"><div class="box menu"><button id="watchClose" class="xbtn" aria-label="關閉">✕</button><h2 data-t="ui.watchPick">選擇小球</h2><p class="dim" id="wstat"></p><div class="page" id="wlist"></div></div></div>
<div class="ov" id="ovMap"><div class="box wide mapbox"><button id="mapClose" class="xbtn" aria-label="關閉">✕</button><h2 id="mapTitle"></h2><div class="mapwrap" id="mapWrap"><img id="mapImg" alt=""></div><div class="pp mapinfo" id="mapInfo"></div></div></div>
<div class="ov" id="ovHall"><div class="box wide mapbox hallbox"><button id="hallClose" class="xbtn" aria-label="關閉">✕</button><h2 id="hallTitle"></h2><div class="hallgrid"><div class="hlift" id="hallLift"></div><div class="hallscene"><img id="hallBg" class="hbg" alt=""><canvas id="hallLand" class="hland" width="720" height="360"></canvas><img id="hallChr" class="hchr" alt=""><span id="hallWho" class="sname"></span><span id="hallWhere" class="hwhere"></span></div><div class="pp htalk" id="hallTalk"></div><div class="hacts" id="hallActs"></div><span id="hallHeart" class="hheart"></span><button id="hallLeave"></button></div></div></div>
<div class="ov" id="ovAch"><div class="box menu achbox"><button id="achClose" class="xbtn" aria-label="關閉">✕</button><h2 id="achTitle"></h2><div class="achtop"><span id="achHead" class="hheart"></span><button id="achAll" class="main" class="ib"></button></div><div class="page" id="achBody"></div></div></div>
<div class="ov" id="ovSpecial"><div class="box menu achbox"><button id="spClose" class="xbtn" aria-label="關閉">✕</button><h2 id="spTitle"></h2><p id="spHint" class="dim sphint"></p><div class="page" id="spBody"></div></div></div>
<div class="ov" id="ovShop"><div class="box wide mapbox shopbox"><button id="shopClose" class="xbtn" aria-label="關閉">✕</button><h2 id="shopTitle"></h2><div class="mapwrap shopwrap" id="shopWrap"><img id="shopImg" alt=""><div id="shopPvBox" class="shoppv" hidden><canvas id="shopPv" width="96" height="96"></canvas><div class="pvbtns"><button id="shopPvBuy" class="main"></button><button id="shopPvBack"></button></div></div></div><div class="hallscene shopscene" id="shopScene" hidden><img id="shopSBg" class="hbg" alt=""><img id="shopSCase" class="scase" alt=""><canvas id="shopLand" class="hland" width="720" height="480"></canvas><img id="shopChr" class="hchr" alt=""><span id="shopWho" class="sname"></span></div><div class="shoptalk"><div class="pp" id="shopTalk"></div></div><div class="shopfoot"><span id="shopPts" class="shoppts"></span><button id="shopChat"></button><button id="shopLeave"></button></div></div></div>

<div class="ov" id="ovMenu"><div class="box wide menu"><button id="menuClose" class="xbtn" aria-label="關閉">✕</button>
<h2 id="menuTitle"></h2>

<p id="lmsg" class="dim" role="status"></p>
<div id="llist"></div>
</div>

<div class="collwrap"><div class="filter cnav" id="cfilter"></div>
<div id="collBody"></div></div>
</div>

<div class="page" id="pg_save" hidden>
<div class="tabs jtabs" id="saveTabs"><button data-to="secSet" data-t="ui.set">設定</button><button data-to="secSave" data-t="ui.save">存檔</button></div>
<section id="secSet"><h3 data-t="ui.set">設定</h3><div id="setBody"></div></section>
<hr class="div">
<section id="secSave"><h3 data-t="ui.save">存檔</h3>
<p class="dim" data-t="ui.saveHint">進度存在這個瀏覽器裡。換裝置時，請在舊裝置按「下載進度」，再到新裝置按「上傳進度」（會合併，不會覆蓋）。</p>
<div class="row2"><button id="cDown" data-t="ui.down">下載日常進度</button><button id="cDownS" data-t="ui.downS">下載主線存檔</button></div>
<p class="dim upnote" data-t="ui.upNote">合併：檔案裡有、這裡沒有的才補上（小球、空的存檔格），原本的都留著。覆蓋：檔案裡有的那一邊（日常或主線），整個換成檔案裡的。</p>
<div class="upmode"><span class="dim" data-t="ui.upMode">上傳模式</span><div class="tabs" id="cMode"><button type="button" data-m="over" data-t="ui.modeOver">覆蓋</button><button type="button" data-m="merge" class="on" data-t="ui.modeMerge">合併</button></div></div>
<label class="fbtn upbtn"><span data-t="ui.up">上傳</span><input type="file" id="cUp" accept=".json,application/json" hidden></label>
<p id="cmsg" class="dim" role="status"></p>
<details><summary class="dim" data-t="ui.code">文字進度碼（備用）</summary><textarea id="saveText" aria-label="進度碼"></textarea><button id="cImport" data-t="ui.import">匯入上方文字</button></details>
<div class="savefoot"><button id="cWipe" class="danger" data-t="ui.wipe">清除存檔</button></div>
</section>
</div>
