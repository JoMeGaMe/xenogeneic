<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>異種幼體養成模擬器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main><div class="game"><div class="left">
<header><span><span id="day">第 1 日 / 7</span><span class="pips" id="pips" title="今日剩餘行動次數"></span></span><span id="cname"></span><span id="pname"></span></header>
<canvas id="tank" width="500" height="500" aria-label="水缸與異種幼體"></canvas>
<div id="status"></div>
<div id="log" role="log" aria-live="polite"></div>
<div class="tools"><button id="bAbout">說明</button><button id="bCodex">圖鑑</button></div>
</div>
<div id="acts">
<button id="bWater">換水<small>不耗行動</small></button>
<button id="bFeed">餵食<small>不耗行動</small></button>
<button id="bPlay">玩耍<small>耗 1 行動</small></button>
<button id="bOut">出門<small>耗 1 行動</small></button>
<button id="bBag">物品<small>查看庫存</small></button>
<button id="end">結束今日</button>
</div>
</div>
</main>
<div class="ov show" id="ovStart"><div class="box">
<h2>異種幼體養成模擬器</h2>
<p>一顆透明的小果凍剛出生了。用七天照顧牠、觀察牠，看看牠會長成什麼樣子。</p>
<label for="pn">你的名字</label>
<input type="text" id="pn" maxlength="8" value="玩家">
<label for="nm" style="display:block;margin-top:10px">幼體的名字</label>
<input type="text" id="nm" maxlength="8" value="小球">
<p style="margin-top:10px">你的代表色。你的名字會用這個顏色顯示，等幼體足夠親近你，核心也會染上同一種顏色。</p>
<div class="sw" id="sw"></div>
<div class="cust"><input type="color" id="cp" value="#58a6ff" aria-label="自訂顏色"><input type="text" id="hex" placeholder="#RRGGBB 或 255,128,0" aria-label="色碼或 RGB"></div>
<button id="go">開始養成</button>
<div class="row2"><button id="sAbout">說明</button><button id="sCodex">圖鑑</button></div>
</div></div>
<div class="ov" id="ovAbout"><div class="box wide"><h2>說明</h2><div id="aboutBody"></div><button id="aboutClose">關閉</button></div></div>
<div class="ov" id="ovCodex"><div class="box wide"><h2>圖鑑</h2><p id="cstat"></p><p id="cends" class="dim"></p><div class="dim" id="cdeco"></div><div class="cgrid" id="cgrid"></div><p id="cmsg" class="dim" role="status"></p>
<div class="row2"><button id="cDown">下載進度</button><label class="fbtn">上傳進度<input type="file" id="cUp" accept=".json,application/json" hidden></label></div>
<details><summary class="dim">文字進度碼（備用）</summary><textarea id="saveText" aria-label="進度碼"></textarea><button id="cImport">匯入上方文字</button></details>
<button id="codexClose">關閉</button></div></div>
<div class="ov" id="ovPick"><div class="box"><h2 id="pt"></h2><div id="po"></div><button id="pc">取消</button></div></div>
<div class="ov" id="ovEnd"><div class="box"><h2 id="et"></h2><p id="ex"></p><p id="sum"></p><button id="again">重新開始</button></div></div>

<script src="js/utils.js"></script>
<script src="js/data/assets-inline.js"></script>
<script src="js/data/items.js"></script>
<script src="js/data/endings.js"></script>
<script src="js/data/emotes.js"></script>
<script src="js/data/about.js"></script>
<script src="js/data/decor.js"></script>
<script src="js/data/sprites.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/actions.js"></script>
<script src="js/settle.js"></script>
<script src="js/endings.js"></script>
<script src="js/codex.js"></script>
<script src="js/render/canvas.js"></script>
<script src="js/render/sprites.js"></script>
<script src="js/render/larva.js"></script>
<script src="js/render/emote.js"></script>
<script src="js/render/creature.js"></script>
<script src="js/render/guests.js"></script>
<script src="js/render/scene.js"></script>
<script src="js/main.js"></script>

</body>
</html>
